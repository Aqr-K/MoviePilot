[mypy]
python_version = 3.12
strict = True
warn_unused_configs = True
ignore_missing_imports = True
follow_imports = skip
show_error_codes = True
pretty = True
files =
    app/domain/episode.py,
    app/domain/media.py,
    app/domain/torrent.py,
    app/domain/meta/infopath.py,
    app/runtime/correlation.py,
    app/runtime/observability/__init__.py,
    app/runtime/event/contracts.py,
    app/runtime/event/errors.py,
    app/runtime/extensions/contract/module_method.py,
    app/api/host_runtime.py,
    app/api/context.py,
    app/application/outbox.py,
    app/application/scheduling.py,
    app/application/workflow.py,
    app/application/workflow_transactional.py,
    app/application/orchestration/context.py,
    app/application/orchestration/durable_events.py,
    app/application/orchestration/transactional_events.py,
    app/application/messaging/ingress.py,
    app/application/subscription/delete.py,
    app/application/subscription/identity.py,
    app/application/subscription/mutation.py,
    scripts/architecture/async_blocking.py
